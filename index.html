<header class="np" style="display:none"><h1>SM TiMatrix</h1><div class="row"><button class="btn" onclick="bk()">بیک اپ</button><button class="btn" onclick="$('#rf').click()">ری اسٹور</button><input type="file" id="rf" accept=".json" hidden onchange="rs(this)"></div></header>

<script>
const $=s=>document.querySelector(s),K='sm_dept_timetable_v1';
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DEF={dept:'شعبہ علوم اسلامیہ و دینیہ',sess:'',classes:[],teachers:[],subjects:[],asg:[],days:['پیر','منگل','بدھ','جمعرات','جمعہ'],
slots:[['08:30','09:30'],['09:30','10:30'],['10:30','11:30'],['11:30','12:30'],['12:30','13:30']].map(x=>({s:x[0],e:x[1],b:false})),alts:[],cur:0,final:null};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(K)||'{}'))}catch(x){S=DEF}
const ALL=['پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ','اتوار'],DL={1:'1 گھنٹہ',1.5:'1.5 گھنٹہ',2:'2 گھنٹے',3:'3 گھنٹے'};
const TABS=[['cl','۱ کلاسیں'],['te','۲ اساتذہ'],['su','۳ مضامین'],['se','۴ سمسٹر کے مضامین'],['ti','۵ دن اور اوقات'],['tt','۶ ٹائم ٹیبل']];
let tab='cl',MSG='',BAD=0,U=[],view='m',vsel='',sc='';
const mn=t=>{const a=t.split(':');return +a[0]*60+ +a[1]},fm=t=>{const a=t.split(':');return (+a[0]%12||12)+':'+a[1]};
const nm=(l,id,d)=>{const x=S[l].find(y=>y.id==id);return x?((l=='subjects'&&x.code?'\u2066('+x.code+')\u2069 ':'')+((S.lang=='ar'&&x.ar)?x.ar:(S.lang=='en'&&x.en)?x.en:(l=='classes'?String(x.name).replace(/\s*Semester\s*$/i,''):x.name))):(d||'—')};
const cn=a=>a.map(x=>nm('classes',x)).join(' + ');
const cur=()=>S.alts[S.cur];
function R(){localStorage.setItem(K,JSON.stringify(S));
const v={cl:()=>vL('classes','کلاسیں / سمسٹرز','مثلاً BS 4th'),te:()=>vL('teachers','اساتذہ','استاد کا نام'),su:vSu,se:vSe,ti:vTi,tt:vTt}[tab]();
$('#app').innerHTML=(MSG?`<div class="msg np ${BAD?'bad':''}">${MSG}</div>`:'')+v;MSG='';BAD=0;
$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';R()">${t[1]}</button>`).join('')}
function note(m,b){MSG=m;BAD=b?1:0;R();scrollTo(0,0)}
/* lists */
function vL(k,h,ph){return `<h2>${h}</h2><div class="row"><input id="nw" placeholder="${ph}" onkeydown="if(event.key=='Enter')add('${k}')"><button class="btn p" onclick="add('${k}')">شامل کریں</button>${k=='classes'?'<button class="btn" onclick="pre()">BS سمسٹر 1 تا 8 شامل کریں</button>':''}</div><ul>${S[k].map(x=>`<li><span>${e(x.name)}</span><span><button class="btn" onclick="ed('${k}','${x.id}')">ترمیم</button> <button class="btn d" onclick="del('${k}','${x.id}')">حذف</button></span></li>`).join('')||'<p class="free">ابھی کوئی اندراج نہیں۔</p>'}</ul>`}
function add(k){const v=$('#nw').value.trim();if(v){S[k].push({id:uid(),name:v})}R();const n=$('#nw');n&&n.focus()}
function pre(){['1st','2nd','3rd','4th','5th','6th','7th','8th'].forEach(o=>{const n=`BS ${o}`;if(!S.classes.some(c=>c.name==n))S.classes.push({id:uid(),name:n})});R()}
function ed(k,id){const x=S[k].find(y=>y.id==id),v=prompt('نیا نام',x.name);if(v&&v.trim()){x.name=v.trim();R()}}
function del(k,id){if(!confirm('کیا حذف کریں؟'))return;S[k]=S[k].filter(x=>x.id!=id);if(k=='classes')S.asg=S.asg.filter(a=>a.cid!=id);else S.asg.forEach(a=>{if(a.tid==id)a.tid=''});S.alts=[];S.cur=0;R()}
/* subjects */
const opt=(l,s,f)=>l.map(x=>`<option value="${x}" ${x==s?'selected':''}>${f?f(x):x}</option>`).join('');
function vSu(){const r=(s)=>`<td><input value="${e(s.name)}" onchange="us('${s.id}','name',this.value)"></td><td><select onchange="us('${s.id}','credit',+this.value)">${opt([1,2,3,4,5,6],s.credit)}</select></td><td><select onchange="us('${s.id}','dur',+this.value)">${opt([1,1.5,2,3],s.dur,x=>DL[x])}</select></td><td><div class="wk"><input type="number" min="0.5" step="0.5" value="${s.weekly}" onchange="us('${s.id}','weekly',+this.value)"> <button class="btn" title="${L('خودکار (کریڈٹ آورز کے برابر)','Auto (= credit hours)')}" onclick="aw('${s.id}')">↺</button></div></td><td class="cw">${cwTxt(s)}</td><td><button class="btn d" onclick="ds('${s.id}')">حذف</button></td>`;
return `<h2>مضامین</h2><div class="row"><input id="sn" placeholder="مضمون کا نام"><button class="btn p" onclick="as()">مضمون شامل کریں</button></div>
<table><tr><th>مضمون</th><th>Credit Hours</th><th>فی کلاس دورانیہ</th><th>ہفتہ وار مطلوبہ گھنٹے</th><th>${L('ہفتے میں کلاسیں','Classes / week')}</th><th></th></tr>${S.subjects.map(s=>`<tr>${r(s)}</tr>`).join('')}</table>
<p class="free">مثال: تفسیر — 3 Credit Hours — 1.5 گھنٹہ فی کلاس — ہفتے میں 3 گھنٹے = ہفتے میں دو کلاسیں۔</p>`}
function as(){const v=$('#sn').value.trim();if(v)S.subjects.push({id:uid(),name:v,credit:3,dur:1,weekly:3});R()}
function us(id,f,v){S.subjects.find(s=>s.id==id)[f]=v;S.alts=[];S.cur=0;R()}
function ds(id){if(!confirm('کیا حذف کریں؟'))return;S.subjects=S.subjects.filter(s=>s.id!=id);S.asg=S.asg.filter(a=>a.sid!=id);S.alts=[];S.cur=0;R()}
/* semester setup + merge */
function vSe(){if(!S.classes.length||!S.subjects.length)return '<p class="msg">پہلے کلاسیں اور مضامین شامل کریں۔</p>';
if(!S.classes.some(c=>c.id==sc))sc=S.classes[0].id;
const mine=S.asg.filter(a=>a.cid==sc);
const rows=S.subjects.filter(s=>subOk(s)||mine.some(x=>x.sid==s.id)).map(s=>{const a=mine.find(x=>x.sid==s.id);return `<div class="chk"><input type="checkbox" ${a?'checked':''} onchange="tg('${s.id}',this.checked)"><span style="min-width:150px">${e(nm('subjects',s.id))} ${badge(s)}</span><select ${a?'':'disabled'} onchange="st('${s.id}',this.value)"><option value="">— استاد منتخب کریں —</option>${S.teachers.map(t=>`<option value="${t.id}" ${a&&a.tid==t.id?'selected':''}>${e(nm('teachers',t.id))}</option>`).join('')}</select>${rsel(a?a.room:'',"sr('"+s.id+"',this.value)",!a)}<label class="cons" title="${L('لگاتار: اس مضمون کی ہفتہ وار تمام کلاسیں ایک کے بعد ایک رکھی جاتی ہیں','Consecutive: all weekly classes of this subject are placed back-to-back')}"><input type="checkbox" ${a&&a.cons?'checked':''} ${a?'':'disabled'} onchange="sc2('${s.id}',this.checked)"></label>${a&&a.g?'<span class="free">ضم شدہ</span>':''}</div>`}).join('');
const all=S.asg.map(a=>`<div class="chk"><input type="checkbox" class="mg" value="${a.id}"><span>${e(nm('classes',a.cid))}</span><span style="min-width:120px">${e(nm('subjects',a.sid))}</span><span>${e(nm('teachers',a.tid,'استاد نہیں'))}</span>${a.g?'<span class="free">ضم: '+e(cn(S.asg.filter(x=>x.g==a.g).map(x=>x.cid)))+'</span>':''}</div>`).join('');
return `<h2>سمسٹر کے مضامین اور اساتذہ</h2><div class="row"><select onchange="sc=this.value;R()">${S.classes.map(c=>`<option value="${c.id}" ${c.id==sc?'selected':''}>${e(c.name)}</option>`).join('')}</select></div>${rows}
<h2>کلاسیں ضم کریں (Merge)</h2><p class="free">ایک ہی مضمون کی دو یا زیادہ کلاسیں منتخب کریں اور "ضم کریں" دبائیں۔</p>${all||'<p class="free">ابھی کوئی مضمون منتخب نہیں۔</p>'}
<div class="row"><button class="btn p" onclick="mg()">ضم کریں</button><button class="btn" onclick="um()">الگ کریں</button></div>`}
function tg(sid,on){if(on)S.asg.push({id:uid(),cid:sc,sid,tid:'',g:null});else{const a=S.asg.find(x=>x.cid==sc&&x.sid==sid);S.asg=S.asg.filter(x=>x!=a);fixg()}S.alts=[];S.cur=0;R()}
function st(sid,v){const a=S.asg.find(x=>x.cid==sc&&x.sid==sid);a.tid=v;if(a.g)S.asg.forEach(x=>{if(x.g==a.g)x.tid=v});S.alts=[];S.cur=0;R()}
const sel=()=>[...document.querySelectorAll('.mg:checked')].map(x=>S.asg.find(a=>a.id==x.value));
function fixg(){S.asg.forEach(a=>{if(a.g&&S.asg.filter(x=>x.g==a.g).length<2)a.g=null})}
function mg(){const l=sel();if(l.length<2)return note('ضم کرنے کے لیے کم از کم دو کلاسیں منتخب کریں۔',1);
if(new Set(l.map(a=>a.sid)).size>1)return note('صرف ایک ہی مضمون کی کلاسیں ضم ہو سکتی ہیں۔',1);
if(new Set(l.map(a=>a.cid)).size<l.length)return note('ایک ہی کلاس دوبارہ منتخب ہے۔',1);
const g=uid(),t=(l.find(a=>a.tid)||l[0]).tid;l.forEach(a=>{a.g=g;a.tid=t});fixg();S.alts=[];S.cur=0;R()}
function um(){sel().forEach(a=>a.g=null);fixg();S.alts=[];S.cur=0;R()}
/* time setup */

function mcs(T,moves,free,casc,seed){seed=seed||0;const cs=courses(),C=id=>cs.find(x=>x.id==id),RR=rng(seed*13+5),D=S.days;
const pl=T.pl.map(p=>({c:p.c,d:p.d,i:p.i,n:p.n,m:p.m,od:p.d,oi:p.i})),fx=new Set(),un=new Set(),sh=new Set();
for(const m of moves){const p=pl[m.k],o=cands(p.m||C(p.c).dur,C(p.c).cl).find(z=>z.d==m.d&&z.i==m.i);if(!o)return null;p.d=o.d;p.i=o.i;p.n=o.n;fx.add(m.k)}
const ov=(a,b)=>a.d==b.d&&a.i<b.i+b.n&&b.i<a.i+a.n,cf=(a,b)=>{const x=C(a.c),y=C(b.c);return x.tk==y.tk||x.cl.some(z=>y.cl.includes(z))};
const hits=k=>pl.map((q,j)=>j).filter(j=>j!=k&&!un.has(j)&&ov(pl[k],pl[j])&&cf(pl[k],pl[j]));
for(const a of fx)for(const b of fx)if(a<b&&ov(pl[a],pl[b])&&cf(pl[a],pl[b]))return null;
const q0=[];fx.forEach(k=>hits(k).forEach(j=>{if(!fx.has(j)&&!q0.includes(j))q0.push(j)}));
if(free)pl.forEach((p,k)=>{if(!fx.has(k)&&free.has(C(p.c).tid)&&!q0.includes(k)){q0.push(k);sh.add(k)}});
q0.forEach(k=>un.add(k));let cnt=0;
function go(Q,dep){if(!Q.length)return true;if(++cnt>4000)return false;const k=Q[0],p=pl[k],c=C(p.c),rest=Q.slice(1),sv={d:p.d,i:p.i,n:p.n};
const Lc=cands(p.m||c.dur,c.cl).filter(o=>!(sh.has(k)&&o.d==p.od&&o.i==p.oi)).map(o=>({o,s:Math.abs(D.indexOf(o.d)-D.indexOf(p.od))*10+Math.abs(o.i-p.oi)+(seed?RR()*8:0)})).sort((a,b)=>a.s-b.s);
for(const x of Lc){const o=x.o;p.d=o.d;p.i=o.i;p.n=o.n;un.delete(k);const h=hits(k);
if(!h.length){if(go(rest,dep))return true}
else if(casc&&dep<3&&h.every(j=>!fx.has(j))){h.forEach(j=>un.add(j));if(go(rest.concat(h),dep+1))return true;h.forEach(j=>un.delete(j))}
un.add(k)}
p.d=sv.d;p.i=sv.i;p.n=sv.n;return false}
if(!go(q0,0))return null;
return{pl:pl.map(p=>({c:p.c,d:p.d,i:p.i,n:p.n,m:p.m})),ch:pl.filter(p=>p.d!=p.od||p.i!=p.oi).length}}

['st','in','لوگو شامل کریں','Add logos','"ادارہ" کے صفحے پر نیچے دو لوگو اپ لوڈ کر سکتے ہیں۔ یہ پرنٹ، PDF اور Word کے اوپر آتے ہیں۔','At the bottom of the "Institution" page you can upload two logos. They appear at the top of print, PDF and Word.',()=>!!(S.logo1||S.logo2)],
['st','ss','سیشن اور سمسٹر چنیں (مرحلہ 2)','Choose session and term (step 2)','خزاں یا بہار اور تعلیمی سیشن (مثلاً 2026–27) منتخب کریں۔ نیا سیشن "+ نیا سیشن شامل کریں" سے بنائیں۔ ہر سیشن اور سمسٹر کا ڈیٹا اور ٹائم ٹیبل الگ محفوظ رہتا ہے۔','Select Fall or Spring and the session (e.g. 2026–27). Add a new one with "+ Add New Session". Every session and term keeps its own data and timetable.',()=>true],
['st','cl','کلاسیں اور پروگرام شامل کریں (مرحلہ 3)','Add programs and classes (step 3)','پروگرام (BS، MPhil، PhD) اور ان کے اندر کلاسیں شامل کریں۔ "BS سمسٹر 1 تا 8 شامل کریں" کا بٹن سب ایک ساتھ بنا دیتا ہے۔ نام میں "Semester" لکھنا ضروری نہیں، صرف BS 1st کافی ہے۔','Add programs (BS, MPhil, PhD) and the classes inside them. "Add BS Semesters 1-8" creates them at once. You do not need the word "Semester": BS 1st is enough.',()=>S.classes.length>0],
['st','su','مضامین شامل کریں (مرحلہ 4)','Add subjects (step 4)','ہر مضمون کا اردو نام، English نام (اختیاری)، Credit Hours اور فی کلاس دورانیہ (1، 1.5، 2، 3 گھنٹے) لکھیں۔ ہفتہ وار گھنٹے Credit Hours کے برابر خود بھر جاتے ہیں؛ بدلنا ہو تو خانے میں لکھ دیں، واپس خودکار کے لیے ↺ دبائیں۔ ہفتہ وار گھنٹے ÷ دورانیہ = ہفتے میں کلاسوں کی تعداد (3 گھنٹے اور 1.5 گھنٹہ فی کلاس = دو کلاسیں)۔','Enter each subject\'s Urdu name, English name (optional), Credit Hours and class duration (1, 1.5, 2, 3 hours). Weekly hours fill in automatically from the credit hours; type a new value to change it, or press ↺ for automatic again. Weekly hours ÷ duration = classes per week (3 hours at 1.5 hours = two classes).',()=>S.subjects.length>0],
['st','te','اساتذہ شامل کریں اور مضامین دیں (مرحلہ 5)','Add teachers and give them subjects (step 5)','اساتذہ کے نام (اردو اور English) شامل کریں۔ ہر استاد کے نیچے "تفویض شدہ مضامین" کھول کر مضمون اور کلاس چنیں اور "+ مضمون شامل کریں" دبائیں۔ غلط تفویض "ہٹائیں" سے ختم کریں۔','Add teachers (Urdu and English names). Under each teacher open "Assigned subjects", pick a subject and a class and press "+ Add Subject". Remove a wrong assignment with "Remove".',()=>S.teachers.length>0],
['st','se','کلاس کے مضامین اور مشترکہ کلاس (مرحلہ 6)','Class subjects and combined classes (step 6)','اوپر سے کلاس چنیں، اس کے مضامین پر ٹک لگائیں اور ہر مضمون کا استاد (اور چاہیں تو کمرہ) چنیں۔ ایک ہی مضمون کئی کلاسوں کو مل کر پڑھانا ہو تو نیچے "مشترکہ کلاس بنائیں" میں مضمون، استاد اور دو یا زیادہ کلاسیں چن کر بنائیں۔ سب کا وقت ایک ہوگا اور ورک لوڈ میں ایک ہی کلاس گنی جائے گی۔','Choose a class at the top, tick its subjects and pick each subject\'s teacher (and a room if you like). To teach one subject to several classes together, use "Create Combined Class" below: pick the subject, the teacher and two or more classes. They share one time slot and count as one class in the workload.',()=>S.asg.length>0],
['st','rm','کمرے شامل کریں (مرحلہ 7)','Add rooms (step 7)','اپنے کمروں کے نمبر لکھیں۔ کمرے خود مقرر ہوتے ہیں اور ایک کمرہ ایک وقت میں ایک ہی کلاس کو ملتا ہے۔ کمرے کم پڑ جائیں تو "عارضی کمرہ" لگ جاتا ہے۔','Type your room numbers. Rooms are assigned automatically and a room is never given to two classes at once. If rooms run short, a "Virtual Room" is used.',()=>(S.rooms||[]).length>0],
['st','ti','دن اور اوقات مقرر کریں (مرحلہ 8)','Set days and times (step 8)','ہفتے کے دن چنیں، ایک ایک گھنٹے کے سلاٹ (8:30 سے) رکھیں اور ضرورت ہو تو وقفہ نشان زد کریں۔ "ٹائم ٹیبل کب تک ختم ہو؟" سے آخری وقت مقرر کریں؛ اس کے بعد کوئی کلاس نہیں لگے گی۔ 1.5 گھنٹے کی کلاس کے لیے آدھے گھنٹے کے سلاٹ بنانے ہوں گے۔','Pick the weekdays, keep one-hour slots (from 8:30) and mark a break if needed. "Timetable must end by" sets the last time; no class is placed after it. A 1.5-hour class needs half-hour slots.',()=>S.slots.some(s=>!s.b)],
['st','dy','کلاس کے دن (اختیاری) (مرحلہ 9)','Class days (optional) (step 9)','کسی کلاس کا کوئی دن بند کرنا ہو (مثلاً BS 1st کا جمعہ) یا MPhil کو صرف دو دن دینے ہوں تو باقی دنوں کا ٹک ہٹا دیں۔','To close a day for a class (e.g. Friday for BS 1st) or give MPhil only two days, untick the other days.',()=>true],
['tt','','ٹائم ٹیبل بنائیں','Generate the timetable','سنہری بٹن "+ ٹائم ٹیبل بنائیں" دبائیں۔ پروگرام استاد، کلاس، کمرے، وقفے، دنوں اور End Time کی پابندیاں دیکھ کر مکمل ٹائم ٹیبل بناتا ہے۔ نہ بن سکے تو پیغام میں وجہ اور حل لکھا ہوتا ہے۔','Press the gold "+ Generate Timetable" button. The program respects teacher, class, room, break, day and end-time rules and builds the full timetable. If it cannot, the message tells you why.',()=>!!cur()],
['tt','','ٹائم ٹیبل دیکھیں','View the timetable','اوپر کے ڈراپ ڈاؤن سے پورا شعبہ، صرف BS / MPhil / PhD، کلاس کے لحاظ سے یا استاد کے لحاظ سے ٹائم ٹیبل دیکھیں۔ ایک وقت میں کئی کلاسیں ہوں تو وہ BS 1st، 2nd، 3rd کی ترتیب سے ایک کے نیچے ایک آتی ہیں۔','Use the top drop-down to see the whole department, only BS / MPhil / PhD, by class or by teacher. When many classes meet at once they are stacked in order: BS 1st, 2nd, 3rd.',()=>!!cur()],
['tt','','رنگوں سے پہچان','Colour coding','ٹائم ٹیبل کے اوپر "رنگ" کی فہرست سے استاد، مضمون یا کلاس کے لحاظ سے رنگ چنیں، یا رنگ بند کر دیں۔ جدول کے نیچے رنگوں کی وضاحت آتی ہے۔','Above the timetable choose "Color: by teacher / subject / class" or turn colours off. A key below the table explains the colours.',()=>true],
['tt','','تبدیلی، کمرہ اور متبادل','Changes, rooms and alternatives','کسی کلاس پر کلک کریں: نیا وقت چن کر "نئے وقت پر منتقل کریں"، یا "منتقل کریں اور کم سے کم تبدیلی کریں" (صرف ضروری کلاسیں ہلتی ہیں)، یا "متبادل وقت تلاش کریں" (تین تک متبادل، کم تبدیلی والا پہلے)۔ وہیں سے اس وقت کا کمرہ بھی بدل سکتے ہیں۔ "صرف منتخب اساتذہ کا ٹائم ٹیبل تبدیل کریں" میں چنے ہوئے اساتذہ ہی ہلتے ہیں اور "نیا مکمل ٹائم ٹیبل" پورا نیا انتظام دیتا ہے۔ غلطی ہو تو "واپس" دبائیں۔','Click a class: pick a new time and "Move to new time", or "Move with minimum changes" (only necessary classes move), or "Find alternative time" (up to three, fewest changes first). You can also change that slot\'s room there. "Change only selected teachers\' timetable" moves only the chosen teachers; "New full alternative timetable" gives a completely new arrangement. Made a mistake? Press Undo.',()=>!!cur()],
['av','','دستیابی اور ورک لوڈ دیکھیں','Check availability and workload','"دستیابی چیک" میں استاد یا کلاس، دن اور وقت چن کر فارغ یا مصروف دیکھیں۔ نیچے "مشترکہ فارغ اوقات" میں ہر کلاس کے سامنے استاد اور کلاس کے مشترکہ فارغ سلاٹ گنے جاتے ہیں؛ کلاس پر کلک کریں تو پورا جدول کھلتا ہے۔ "ورک لوڈ" میں ہر استاد کے گھنٹے اور کلاسیں ہیں۔','In "Availability" pick a teacher or class, a day and a time to see free or busy. Below, "Common free slots" counts, for each class, the slots free for both teacher and class; click a class to open the full grid. "Workload" lists each teacher\'s hours and classes.',()=>!!cur()],
['tt','','محفوظ اور لاک کریں','Save and lock','ٹائم ٹیبل پسند آنے پر "محفوظ کریں" دبائیں، پھر "ٹائم ٹیبل لاک کریں" تاکہ غلطی سے تبدیلی نہ ہو۔ تبدیلی کرنی ہو تو لاک کھول لیں۔','When you are happy press "Save", then "Lock timetable" so nothing changes by accident. Unlock it when you need to edit.',()=>!!S.final],
['tt','','پرنٹ، PDF اور Word','Print, PDF and Word','"پرنٹ"، "PDF ڈاؤن لوڈ" یا "Word ڈاؤن لوڈ" دبائیں۔ مکمل شعبہ اور پروگرام کا ٹائم ٹیبل A4 Landscape میں آتا ہے۔ اوپر ادارے کا نام اور سیشن، نیچے SM TiMatrix لکھا آتا ہے۔','Press "Print", "Download PDF" or "Download Word". The department and program timetables use A4 landscape. The institution name and session appear on top and SM TiMatrix at the bottom.',()=>true],
['st','dt','بیک اپ اور ری اسٹور','Backup and restore','"بیک اپ" سے ساری معلومات ایک فائل میں محفوظ کریں اور "ری اسٹور" سے واپس لائیں۔ "ڈیمو ڈیٹا دوبارہ شامل کریں" ٹیسٹ کے لیے ہے، اور "تمام ڈیٹا صاف کریں" پہلے تصدیق مانگتا ہے۔','"Backup" saves everything into one file and "Restore" brings it back. "Reload Demo Data" is for testing, and "Clear all data" asks for confirmation first.',()=>true],
['st','dt',"ExaMatrix کے لیے فائل بھیجیں","Send the file to the ExaMatrix in-charge","ٹائم ٹیبل انچارج کا کام:<br>1. بائیں مینو سے \"ڈیٹا اور زبان\" کھولیں۔<br>2. \"ExaMatrix کے لیے فائل بنائیں\" دبائیں۔<br>3. جو چھوٹی فائل ڈاؤن لوڈ ہو (SM-TiMatrix-for-ExaMatrix…) وہ امتحانی انچارج کو بھیج دیں۔<br>اس فائل میں صرف کلاسیں، مضامین (کوڈ سمیت)، اساتذہ، کمرے اور ادارے کا نام ہوتا ہے، ٹائم ٹیبل نہیں، اس لیے فائل بہت چھوٹی ہوتی ہے۔ ٹائم ٹیبل میں بعد میں تبدیلی ہو تو نئی فائل بنا کر بھیج دیں۔ ExaMatrix کی فائل لینی ہو تو اسی صفحے پر \"ExaMatrix کی فائل لوڈ کریں\" دبائیں۔ مضمون کا کوڈ اختیاری ہے؛ کوڈ نہ ہو تو مضمون کو نام کے ساتھ کلاس/سمسٹر ملا کر پہچانا جاتا ہے، کیونکہ ایک نام کا مضمون مختلف سمسٹروں اور پروگراموں میں ہو سکتا ہے۔","Timetable in-charge:<br>1. Open \"Data & Language\" from the left menu.<br>2. Press \"Create file for ExaMatrix\".<br>3. Send the small file that downloads (SM-TiMatrix-for-ExaMatrix…) to the exam in-charge.<br>The file holds only classes, subjects (with codes), teachers, rooms and the institution name, not the timetable, so it is very small. If the timetable changes later, create and send a new file. To take a file from ExaMatrix, press \"Load ExaMatrix file\" on the same page. A subject code is optional; without a code, a subject is recognised by its name together with its class/semester, because one name can appear in different semesters and programs.",()=>true],
['st','dt',"بیک اپ اور ری اسٹور: قدم بہ قدم","Backup and restore: step by step","بیک اپ لینا:<br>1. \"ڈیٹا اور زبان\" کھولیں۔<br>2. \"بیک اپ\" دبائیں۔<br>3. فائل (timetable-backup.json) ڈاؤن لوڈ ہو جائے گی؛ اسے محفوظ جگہ (USB، ای میل یا گوگل ڈرائیو) میں رکھ لیں۔<br>ری اسٹور کرنا:<br>1. \"ڈیٹا اور زبان\" کھولیں۔<br>2. \"ری اسٹور\" دبائیں۔<br>3. بیک اپ فائل منتخب کریں۔<br>4. \"ڈیٹا بحال ہو گیا\" کا پیغام آنے پر صفحات دیکھ لیں۔<br>نوٹ: ری اسٹور سے موجودہ ڈیٹا بدل جاتا ہے، اس لیے پہلے نیا بیک اپ لے لیں۔","Backup:<br>1. Open \"Data & Language\".<br>2. Press \"Backup\".<br>3. The file (timetable-backup.json) downloads; keep it somewhere safe (USB, email or Google Drive).<br>Restore:<br>1. Open \"Data & Language\".<br>2. Press \"Restore\".<br>3. Choose the backup file.<br>4. When \"data restored\" appears, check your pages.<br>Note: restoring replaces the current data, so take a fresh backup first.",()=>true],
['st','dt',"پاس ورڈ اور سیکیورٹی","Password and security","ابتدائی پاس ورڈ <b>بسم اللہ</b> ہے۔ اسے جلد از جلد تبدیل کر لیں۔<br><br>پاس ورڈ تبدیل کرنا:<br>1. \"ڈیٹا اور زبان\" کھولیں اور \"سیکیورٹی اور پاس ورڈ\" کارڈ میں \"سیکیورٹی سیٹنگز کھولیں\" دبائیں۔<br>2. پاس ورڈ درج کریں (شروع میں بسم اللہ)۔<br>3. موجودہ پاس ورڈ، نیا پاس ورڈ اور دوبارہ نیا پاس ورڈ لکھ کر \"پاس ورڈ محفوظ کریں\" دبائیں۔ نیا پاس ورڈ کم از کم 4 حروف کا ہو۔<br><br>چھوٹی تبدیلیوں کے لیے: اسی پینل میں \"چھوٹی تبدیلیوں کے لیے پاس ورڈ لازمی ہو\" کا چیک باکس لگائیں تو ایک ریکارڈ حذف کرنے (کلاس، استاد، مضمون، کمرہ، تفویض، اور ٹائم ٹیبل کا لاک کھولنا) سے پہلے پاس ورڈ پوچھا جائے گا۔ چیک باکس ہٹا دیں تو یہ بغیر پاس ورڈ ہوں گی۔<br><br>مکمل ڈیٹا کے لیے: تمام ڈیٹا صاف کرنا، ڈیمو ڈیٹا لوڈ کرنا ہمیشہ پاس ورڈ مانگتا ہے اور کسی سیٹنگ سے بند نہیں ہو سکتا، تاکہ پورا ڈیٹا غلطی سے یا کسی غیر متعلقہ شخص سے ضائع نہ ہو۔ پاس ورڈ کے بعد تصدیقی پیغام بھی آتا ہے، اور غلط پاس ورڈ یا منسوخ کرنے پر کچھ حذف نہیں ہوتا۔<br><br>یاد رکھیں: پاس ورڈ آپ کے براؤزر میں ہیش کی صورت میں محفوظ ہوتا ہے (سادہ متن میں نہیں) اور بیک اپ میں شامل نہیں ہوتا۔ پانچ بار غلط پاس ورڈ پر کچھ دیر انتظار کرنا پڑتا ہے۔ یہ پروگرام آپ کے اپنے آلے پر آف لائن چلتا ہے، اس لیے یہ پاس ورڈ غلطی سے بچاؤ اور عام لوگوں کو روکنے کے لیے ہے؛ پاس ورڈ کہیں لکھ لیں اور بیک اپ بھی رکھیں۔","The initial password is <b>Bismillah</b>. Please change it as soon as possible.<br><br>To change the password:<br>1. Open \"Data & Language\" and, in the \"Security and password\" card, press \"Open security settings\".<br>2. Enter the password (Bismillah at first).<br>3. Type the current password, the new password and the new password again, then press \"Save password\". The new password must be at least 4 characters.<br><br>Small changes: in the same panel, tick \"Require the password for small changes\" and the password is asked before deleting a single record (class, teacher, subject, room, assignment, and unlocking the timetable). Untick it and these need no password.<br><br>Full data: clearing all data, loading demo data always asks for the password and cannot be switched off, so the whole data is not lost by mistake or by someone else. A confirmation message follows the password, and a wrong password or cancelling deletes nothing.<br><br>Remember: the password is stored in your browser as a hash (never as plain text) and is not part of backups. After five wrong attempts you must wait a while. This program runs offline on your own device, so the password protects against mistakes and casual users, not against a determined technical person; write the password down and keep backups.",()=>true],
['st','dt','انسٹال اور آف لائن استعمال','Install and offline use','براؤزر اجازت دے تو "پروگرام انسٹال کریں" کا بٹن آتا ہے۔ انسٹال کرنے کے بعد پروگرام موبائل یا کمپیوٹر کی ایپ کی طرح انٹرنیٹ کے بغیر چلتا ہے۔ آپ کا ڈیٹا آپ کے اپنے آلے میں رہتا ہے، اور نیا ورژن آنے پر خود بخود آ جاتا ہے۔','When your browser allows it, an "Install app" button appears. Once installed, the program runs like a phone or computer app, even without internet. Your data stays on your own device, and new versions arrive automatically.',()=>true]],

ي» يعرض ساعات كل مدرّس وحصصه.", "In the print window choose \"Save as PDF\".": "في نافذة الطباعة اختر «حفظ بصيغة PDF».", "Increase the end time under \"Timetable must end by\".": "ارفع وقت الانتهاء في «يجب أن ينتهي الجدول عند».", "Institution": "المؤسسة", "Institution name and session on top, program name at the bottom": "اسم المؤسسة والعام الدراسي في الأعلى واسم البرنامج في الأسفل", "Institution names (Urdu and English)": "أسماء المؤسسة (بالأردية والإنجليزية والعربية)", "Jameel Noori Nastaleeq (when installed)": "خط جميل نوري نستعليق (عند تثبيته)", "Language": "اللغة", "Language & design": "اللغة والتصميم", "Lock": "القفل", "Locked": "مقفل", "Madaris, schools and colleges: choose \"Annual\" for a yearly syllabus, with your own programs and classes.": "المدارس الدينية والمدارس والكليات: اختر «سنوي» للمنهج السنوي، مع برامجك وصفوفك الخاصة.", "MAIN": "الرئيسية", "Make weekly hours a multiple of the duration (e.g. 3 and 1.5).": "اجعل الساعات الأسبوعية من مضاعفات المدة (مثلاً 3 و1.5).", "Manual move with clash warning": "النقل اليدوي مع تحذير التعارض", "Message": "الرسالة", "min": "دقيقة", "More options": "خيارات أخرى", "Move here": "انقل إلى هنا", "Move this class": "انقل هذه الحصة", "Move to new time": "النقل إلى وقت جديد", "Move with minimum changes": "النقل بأقل عدد من التغييرات", "MPhil / PhD 1st & 2nd semesters": "فصلا MPhil / PhD الأول والثاني", "Name (Urdu)": "الاسم (بالأردية)", "New session name (e.g. 2029–30)": "اسم العام الدراسي الجديد (مثلاً 2029–30)", "No assignments yet.": "لا توجد إسنادات بعد.", "No class is placed after this time.": "لا توضع أي حصة بعد هذا الوقت.", "No class is placed in breaks, on closed days or after the end time.": "لا توضع أي حصة في الاستراحات ولا في الأيام المغلقة ولا بعد وقت الانتهاء.", "No class is placed on an unchecked day for that class (e.g. no Friday for BS 1st, or only two days for MPhil). A combined class uses the days open for all its classes.": "لا توضع أي حصة في يوم غير محدد لذلك الصف (مثلاً لا جمعة لـ BS 1st، أو يومان فق <script>/* SM TiMatrix — silent auto-update: no message, no re-install */
(function(){
if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update().catch(function(){})}).catch(function(){});
var sig=null,pending=false;
function probe(){
  return fetch(location.href.split('#')[0].split('?')[0],{method:'HEAD',cache:'no-store'}).then(function(r){
    if(!r.ok)return null;
    var v=(r.headers.get('etag')||'')+'|'+(r.headers.get('last-modified')||'')+'|'+(r.headers.get('content-length')||'');
    return v==='||'?null:v;
  }).catch(function(){return null});
}
function reloadNow(){
  var t=+sessionStorage.getItem('sm_rl')||0;
  if(Date.now()-t<60000)return;           /* never loop */
  try{sessionStorage.setItem('sm_rl',Date.now())}catch(x){}
  location.reload();
}
function check(applyNow){
  return probe().then(function(v){
    if(!v)return;
    if(sig===null){sig=v;return}
    if(v!==sig){pending=true;if(applyNow)reloadNow()}
  });
}
check(false);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){if(pending)reloadNow()}   /* new version is ready when the user returns */
  else check(true);                                                  /* user just came back: update now */
});
addEventListener('online',function(){check(true)});
setInterval(function(){if(document.visibilityState==='visible')check(false)},15*60*1000);
})();

ستعادة».<br>3. اختر ملف النسخة.<br>4. عند ظهور رسالة استعادة البيانات راجع الصفحات.<br>ملاحظة: الاستعادة تستبدل البيانات الحالية، فخذ نسخة جديدة أولاً.", "Two programs, one workflow": "برنامجان وسير عمل واحد", "The timetable in-charge first completes classes, subjects (with codes), teachers and rooms in SM TiMatrix. Then, under \"Data & Language\", pressing \"Create file for ExaMatrix\" makes a small file to hand to the exam in-charge. The exam in-charge loads it in SM ExaMatrix, so teachers, subjects and codes never have to be typed again. Exchange also works the other way: a shared file from ExaMatrix is loaded here with \"Load ExaMatrix file\".": "يُكمل مسؤول الجدول أولاً الصفوف والمواد (مع الرموز) والمدرّسين والقاعات في SM TiMatrix. ثم من «البيانات واللغة» يضغط «إنشاء ملف لـ ExaMatrix» فيحصل على ملف صغير يسلّمه لمسؤول الامتحانات، الذي يحمّله في SM ExaMatrix فلا يحتاج إلى إعادة كتابة المدرّسين والمواد والرموز. والتبادل ممكن في الاتجاه المعاكس أيضاً: يُحمَّل ملف مشترك من ExaMatrix هنا بزر «تحميل ملف ExaMatrix».", "Exchange with ExaMatrix": "التبادل مع ExaMatrix", "Create a small file for the exam in-charge (classes, subjects, codes, teachers, rooms), or load an ExaMatrix file here.": "أنشئ ملفاً صغيراً لمسؤول الامتحانات (الصفوف والمواد والرموز والمدرّسون والقاعات) أو حمّل ملف ExaMatrix هنا.", "Create file for ExaMatrix": "إنشاء ملف لـ ExaMatrix", "Load ExaMatrix file": "تحميل ملف ExaMatrix", "Invalid file.": "الملف غير صالح.", "Import done: ": "تم الاستيراد: ", "File ready. Send it to the exam in-charge.": "الملف جاهز. أرسله إلى مسؤول الامتحانات.", "This code already belongs to another subject in the same program. The code is optional; you can leave it empty.": "هذا الرمز لمادة أخرى في البرنامج نفسه. الرمز اختياري ويمكن تركه فارغاً.", "Code (optional)": "الرمز (اختياري)", "Code (optional) e.g. ISL-101": "الرمز (اختياري) مثل ISL-101"});

(sh.subjects||[]).forEach(o=>{if(!o||!o.id||!o.name)return;let pg=S.progs.includes(o.prog)?o.prog:'';if(!pg){const c0=(sh.classes||[]).find(c=>c.id==(o.cids||[])[0]);pg=c0&&S.progs.includes(c0.prog)?c0.prog:(S.progs[0]||'')}

if(d){if(!d.code&&o.code){d.code=o.code;n++}if(!d.en&&o.en)d.en=o.en;if(!d.ar&&o.ar)d.ar=o.ar}else{const cr=+o.credit||3;S.subjects.push({id:o.id,name:o.name,en:o.en||'',ar:o.ar||'',code:o.code||'',prog:pg,credit:cr,dur:1,weekly:cr});n++}});
S.rooms=S.rooms||[];(sh.rooms||[]).forEach(o=>{if(o&&o.name&&!S.rooms.some(r=>lc(r.name)==lc(o.name))){S.rooms.push({id:o.id||uid(),name:o.name});n++}});
['univ','univEn','univAr','dept','deptEn','deptAr'].forEach(k=>{if(sh.inst&&sh.inst[k]&&!S[k])S[k]=sh.inst[k]});return n}
